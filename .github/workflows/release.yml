name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-x64
            binary: natural-syntax-ls
            ort_glob: "libonnxruntime*.so*"
            ort_dest: libonnxruntime.so
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows-x64
            binary: natural-syntax-ls.exe
            ort_glob: "onnxruntime*.dll"
            ort_dest: onnxruntime.dll
          - os: macos-13
            goos: darwin
            goarch: amd64
            platform: darwin-x64
            binary: natural-syntax-ls
            ort_glob: "libonnxruntime*.dylib"
            ort_dest: libonnxruntime.dylib
          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
            binary: natural-syntax-ls
            ort_glob: "libonnxruntime*.dylib"
            ort_dest: libonnxruntime.dylib

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: go build -o vscode-extension/bin/${{ matrix.platform }}/${{ matrix.binary }} ./cmd/natural-syntax-ls/

      - name: Copy ORT shared library (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ORT_MOD="$(go env GOPATH)/pkg/mod/github.com/yalue/onnxruntime_go@$(go list -m github.com/yalue/onnxruntime_go | awk '{print $2}')"
          echo "ORT_MOD=$ORT_MOD"
          ls "$ORT_MOD"
          ORT_LIB=$(find "$ORT_MOD" -name "${{ matrix.ort_glob }}" | head -1)
          echo "ORT_LIB=$ORT_LIB"
          cp "$ORT_LIB" vscode-extension/bin/${{ matrix.platform }}/${{ matrix.ort_dest }}

      - name: Copy ORT shared library (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (go list -m github.com/yalue/onnxruntime_go).Split(' ')[1]
          $ortMod = "$(go env GOPATH)/pkg/mod/github.com/yalue/onnxruntime_go@$ver"
          Write-Host "ORT_MOD=$ortMod"
          $src = Get-ChildItem -Recurse "$ortMod" -Filter "${{ matrix.ort_glob }}" | Select-Object -First 1
          Write-Host "ORT_LIB=$($src.FullName)"
          Copy-Item $src.FullName "vscode-extension/bin/${{ matrix.platform }}/${{ matrix.ort_dest }}"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: bin-${{ matrix.platform }}
          path: vscode-extension/bin/${{ matrix.platform }}/

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4.3.0
        with:
          path: vscode-extension/bin
          merge-multiple: false

      - name: Flatten artifact dirs
        shell: bash
        run: |
          for platform in linux-x64 windows-x64 darwin-x64 darwin-arm64; do
            mkdir -p vscode-extension/bin/$platform
            if [ -d "vscode-extension/bin/bin-$platform" ]; then
              mv vscode-extension/bin/bin-$platform/* vscode-extension/bin/$platform/
              rmdir vscode-extension/bin/bin-$platform
            fi
          done
          chmod +x vscode-extension/bin/linux-x64/natural-syntax-ls \
                   vscode-extension/bin/darwin-x64/natural-syntax-ls \
                   vscode-extension/bin/darwin-arm64/natural-syntax-ls

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install vsce and deps
        working-directory: vscode-extension
        run: |
          npm install
          npm install -g @vscode/vsce

      - name: Package VSIX
        working-directory: vscode-extension
        run: vsce package --allow-missing-repository

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: vsix
          path: vscode-extension/*.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: vscode-extension/*.vsix
