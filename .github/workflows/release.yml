name: Release

on:
  push:
    tags: ['v*']

env:
  ORT_VERSION: "1.26.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-x64
            binary: natural-syntax-ls
            ort_archive: onnxruntime-linux-x64
            ort_lib_glob: "libonnxruntime.so.*"
            ort_dest: libonnxruntime.so
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows-x64
            binary: natural-syntax-ls.exe
            ort_archive: onnxruntime-win-x64
            ort_lib_glob: "onnxruntime.dll"
            ort_dest: onnxruntime.dll
          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
            binary: natural-syntax-ls
            ort_archive: onnxruntime-osx-arm64
            ort_lib_glob: "libonnxruntime*.dylib"
            ort_dest: libonnxruntime.dylib

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod

      - name: Install mingw (Windows CGO)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install mingw --no-progress -y

      - name: Build binary (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: go build -o vscode-extension/bin/${{ matrix.platform }}/${{ matrix.binary }} ./cmd/natural-syntax-ls/

      - name: Build binary (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: gcc
        run: go build -o vscode-extension/bin/${{ matrix.platform }}/${{ matrix.binary }} ./cmd/natural-syntax-ls/

      - name: Download and extract ORT (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARCHIVE="${{ matrix.ort_archive }}-${{ env.ORT_VERSION }}.tgz"
          URL="https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ORT_VERSION }}/$ARCHIVE"
          echo "Downloading $URL"
          curl -fL "$URL" -o ort.tgz
          mkdir ort_extracted
          tar xzf ort.tgz -C ort_extracted --strip-components=1
          mkdir -p vscode-extension/bin/${{ matrix.platform }}
          LIB=$(find ort_extracted -name "${{ matrix.ort_lib_glob }}" ! -type l | head -1)
          echo "Copying $LIB"
          cp "$LIB" vscode-extension/bin/${{ matrix.platform }}/${{ matrix.ort_dest }}

      - name: Download and extract ORT (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = "${{ matrix.ort_archive }}-${{ env.ORT_VERSION }}.zip"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ORT_VERSION }}/$archive"
          Write-Host "Downloading $url"
          Invoke-WebRequest $url -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ort_extracted
          New-Item -ItemType Directory -Force vscode-extension/bin/${{ matrix.platform }}
          $lib = Get-ChildItem -Recurse ort_extracted -Filter "${{ matrix.ort_lib_glob }}" | Select-Object -First 1
          Write-Host "Copying $($lib.FullName)"
          Copy-Item $lib.FullName "vscode-extension/bin/${{ matrix.platform }}/${{ matrix.ort_dest }}"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: bin-${{ matrix.platform }}
          path: vscode-extension/bin/${{ matrix.platform }}/

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4.3.0
        with:
          path: vscode-extension/bin
          merge-multiple: false

      - name: Flatten artifact dirs
        shell: bash
        run: |
          for platform in linux-x64 windows-x64 darwin-arm64; do
            mkdir -p vscode-extension/bin/$platform
            if [ -d "vscode-extension/bin/bin-$platform" ]; then
              mv vscode-extension/bin/bin-$platform/* vscode-extension/bin/$platform/
              rmdir vscode-extension/bin/bin-$platform
            fi
          done
          chmod +x vscode-extension/bin/linux-x64/natural-syntax-ls \
                   vscode-extension/bin/darwin-arm64/natural-syntax-ls

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Install vsce and deps
        working-directory: vscode-extension
        run: |
          npm install
          npm install -g @vscode/vsce

      - name: Package VSIX
        working-directory: vscode-extension
        run: vsce package --allow-missing-repository

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: vsix
          path: vscode-extension/*.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: vscode-extension/*.vsix
