version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gocritic
    - copyloopvar
    - modernize
    - nilerr
    - errorlint
    - bodyclose
    - noctx
  settings:
    revive:
      rules:
        - name: exported
        - name: receiver-naming
