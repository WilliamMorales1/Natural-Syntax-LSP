version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gocritic
    - copyloopvar
    - modernize
    - nilerr
    - errorlint
    - bodyclose
    - noctx
  settings:
    revive:
      rules:
        - name: exported
        - name: receiver-naming
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, noctx]
      - linters: [errcheck]
        text: "Close|Destroy|DestroyEnvironment"
